[project]
name = "docchat"
version = "0.1.0"
description = "The reference application for Module 9, Shipping an AI Application."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.1",
    "tiktoken>=0.8",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
notebook = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Torch ships a CUDA build by default on Linux, which is about 2.5 GB.
# Nothing in this module runs on a GPU, so we take the CPU wheels instead.
# Lesson 6 is grateful: it is the difference between a 700 MB image and a 6 GB one.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
